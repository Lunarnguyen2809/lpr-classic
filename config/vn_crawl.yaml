      - Vietnam blurry license plate motion
  oblique:
    final_quota: 8
    queries:
      - biển số xe chụp nghiêng góc xéo ảnh thực tế
      - xe ô tô chụp chéo góc biển số
      - Vietnam license plate angled view
  dirty_worn:
    final_quota: 8
    queries:
      - biển số xe bẩn che khuất bùn đất ảnh thực tế
      - biển số xe cũ trầy xước mờ bong tróc
      - Vietnam dirty damaged license plate
  cctv:
    final_quota: 10
    queries:
      - camera giám sát biển số xe ảnh chụp từ camera
      - camera phạt nguội biển số xe

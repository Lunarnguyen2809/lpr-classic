[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr"
version = "0.1.0"
description = "Project 9: License Plate Detection and Character Segmentation (xử lý ảnh cổ điển)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
